alarm_gate:
  confidence_gate: 0.35
  max_aspect_ratio: 5.0
  max_bbox_ratio: 0.5
  min_bbox_area: 400
  min_frames: 3
alert_cooldown_sec: 30
cameras:
- active_hours: null
  camera_id: CAMERAS 02
  enabled: true
  name: cctv
  roi_zones: {}
  rtsp_url: https://stream.palembang.go.id/cam8/index.m3u8
confidence_threshold: 0.35
critical_score_threshold: 80
database:
  cleanup_days: 30
  path: data/cctv_events.db
  snapshot_dir: snapshots
detect_fps_target: 10
device_mode: auto
frame_skip: 0
input_resolution:
- 640
- 480
log_file: data/cctv_ai.log
log_level: INFO
model_name: yolov8n.pt
motion_gate_enabled: true
motion_history: 500
motion_sensitivity: low
motion_var_threshold: 16
snapshot_interval_sec: 120
snapshot_quality: 85
stability_window_sec: 2
storage:
  auto_delete_threshold: 95
  critical_percent: 90
  retention_days: 30
  warning_percent: 80
suspicious_score_threshold: 60
telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  rate_limit_interval: 3.0
  retry_backoff_base: 1.0
  retry_count: 3
  send_timeout: 30
